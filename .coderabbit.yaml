# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
reviews:
  auto_review:
    enabled: true
    # By default CodeRabbit only reviews PRs targeting the default branch.
    # Also review PRs targeting any other branch (e.g. 5.x).
    base_branches:
      - ".*"
  path_instructions:
    - path: "docs/**/*.rst"
      instructions: |
        Review for content accuracy only. Do not review or comment on style,
        grammar, formatting, links or images. Other tools handle those.
        - Verify the content against the Mautic codebase. Check everything
          that developers use, not only the examples here. For example:
          class names, method names, namespaces, events, hooks, API
          endpoints, parameters, return values, config keys, CLI commands,
          database fields and behavior. Flag anything that does not match
          the code.
        - This docs repo has one branch for each Mautic version. The PR's
          base branch (the branch it targets) is the version the page
          documents. Compare the page with the Mautic code repos, using the
          code branch for that same version. If a code repo has a branch
          with the same name as the PR's base branch, use it. If not, use
          the code branch for that major version, which is the major number
          followed by .x. Check that the content and behavior are correct
          for that version.
        - If the code you compare with looks like a different version, say so
          instead of calling it an error.
        - Check that code samples match the text and work for that version.
          This applies to samples written in the page and to samples
          included from a file.